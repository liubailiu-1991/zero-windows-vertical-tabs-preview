<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZERO 垂直标签 A v0.10</title><link rel="stylesheet" href="zero-style.css"><link rel="stylesheet" href="zero-chrome.css"><link rel="stylesheet" href="zero-calibration.css"><link rel="stylesheet" href="assets/assistant-orb.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="adaptation.css"><link rel="stylesheet" href="reference-fixes.css"><link rel="stylesheet" href="feedback.css"><link rel="stylesheet" href="floating.css"><link rel="stylesheet" href="tab-search.css"><link rel="stylesheet" href="address.css"><link rel="stylesheet" href="bookmarks.css"><link rel="stylesheet" href="zero-manager.css"></head><body>
<div id="browser" class="browser">
 <aside id="sidebar" aria-label="垂直标签栏">
  <header class="side-head"><button id="collapse" class="icon-button" aria-label="收起侧栏"></button><div class="combo"><button id="groups-button" aria-label="标签页分组" class="combo-button"></button><button id="search-button" aria-label="标签管理" class="combo-button"></button></div></header><div class="side-separator"></div>
  <div id="tab-area"><div id="pin-dock"><div id="pins-scroll" aria-label="固定标签滚动区域"><div id="pins" role="tablist" aria-label="固定标签页" aria-orientation="vertical"></div></div></div><div id="side-scroll" aria-label="普通标签滚动区域"><div id="vertical-tabs" role="tablist" aria-label="标签页" aria-orientation="vertical"><div id="list"></div></div></div><div id="new-tab-dock"><button id="new-tab" aria-label="打开新的标签页"></button></div></div>
  <div id="resize-handle" role="slider" aria-label="侧栏宽度" tabindex="0" aria-valuemin="126" aria-valuemax="400" aria-valuenow="240"></div>
 </aside>
 <main id="main">
  <div id="horizontal-tabs" hidden><button id="return-vertical" class="icon-button" aria-label="垂直显示标签页"></button><div id="horizontal-list" role="tablist" aria-label="水平标签页"></div><button id="horizontal-new" class="icon-button" aria-label="新增水平标签页"></button></div>
  <nav id="toolbar" aria-label="导航工具栏"><button class="icon-button auxiliary" data-tool="后退" aria-label="后退"></button><button class="icon-button auxiliary" data-tool="前进" aria-label="前进"></button><button class="icon-button auxiliary" data-tool="重新加载" aria-label="重新加载网页"></button><div class="address"><span id="site-icon"></span><input id="address" aria-label="地址栏" spellcheck="false"><button class="icon-button auxiliary" data-tool="收藏" aria-label="收藏"></button></div><div class="toolbar-tools"><button class="icon-button auxiliary" data-tool="扩展程序" aria-label="扩展程序"></button><span class="profile" aria-label="演示用户">L</span><button class="action-pill auxiliary" data-tool="浏览器菜单">请采取行动 <span>⋮</span></button></div><div class="caption"><button data-tool="最小化" class="auxiliary" aria-label="最小化"></button><button data-tool="最大化" class="auxiliary" aria-label="最大化"></button><button data-tool="关闭窗口" class="auxiliary" aria-label="关闭窗口"></button></div></nav>
  <section id="page" aria-label="样例网页"></section>
 </main>
</div>
<div id="hovercard" hidden></div><div id="popover" hidden></div><div id="context-menu" role="menu" hidden></div><div id="submenu" role="menu" hidden></div><div id="toast" role="status" hidden></div>
<script src="native-icons.js"></script><script src="zero-templates.js"></script><script src="zero-shell.js"></script><script src="icons.js"></script><script src="group-icons.js"></script><script src="zero-manager.js"></script><script src="app.js"></script><script src="bookmarks.js"></script></body></html>
