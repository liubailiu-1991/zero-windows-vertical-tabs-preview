<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZERO 标签页管理</title>
<link rel="stylesheet" href="sidebar.css">
<script defer src="sidebar-fixture.js"></script>
<script defer src="window-a/native-icons.js"></script>
<script defer src="window-a/icons.js"></script>
<script defer src="window-a/group-icons.js"></script>
<script defer src="window-a/markup.js"></script>
<script defer src="window-a/window.js"></script>
<script defer src="sidebar.js"></script>
</head>
<body>
<nav id="rail" aria-label="标签页管理">
  <button data-navigation="current" aria-label="窗口标签" title="窗口标签" aria-current="page"></button>
  <button data-navigation="sites" aria-label="所有窗口的站点" title="所有窗口的站点"></button>
  <button data-navigation="bookmarks" aria-label="书签" title="书签"></button>
  <button data-navigation="recent" aria-label="最近关闭" title="最近关闭"></button>
  <button data-navigation="search" aria-label="全局搜索" title="全局搜索"></button>
  <button id="rail-new" aria-label="打开新的标签页" title="打开新的标签页"></button>
  <div class="rail-separator"></div>
  <div id="shortcuts"></div>
  <div class="rail-footer"></div>
  <button id="b-panel-toggle" aria-label="收起侧栏" title="收起侧栏"></button>
  <button id="rail-settings" aria-label="侧栏设置" title="侧栏设置" aria-haspopup="menu"></button>
</nav>
<main>
  <section class="view sp-view" data-view="current">
    <header><div id="windows" aria-label="窗口"></div><button id="deduplicate" title="清理重复标签页" aria-label="清理重复标签页"></button><button id="window-more" title="更多" aria-label="更多" aria-haspopup="menu"></button></header>
    <div class="window-list" data-current-view="windows"></div>
  </section>
  <section class="view sp-view" data-view="sites" hidden><header><span class="heading-icon"></span><strong>所有窗口的站点</strong><span class="heading-tools"></span></header><div class="results" data-current-view="sites"></div></section>
  <section class="view sp-view" data-view="bookmarks" hidden><header><span class="heading-icon"></span><strong>书签</strong><span class="heading-tools"></span></header><div class="results"></div></section>
  <section class="view sp-view" data-view="recent" hidden><header><span class="heading-icon"></span><strong>最近关闭的标签页</strong><span class="heading-tools"></span></header><div class="results"></div></section>
  <section class="view sp-view" data-view="search" hidden>
    <header><label class="search-field"><span id="search-icon"></span><input type="search" id="search" aria-label="搜索标签页、收藏和历史" placeholder="搜索标签页、收藏和历史…" autocomplete="off"></label></header>
    <div class="results"></div>
  </section>
</main>
<div id="notice" role="status" hidden></div>
<dialog id="edit-bookmark" aria-label="编辑书签">
  <form method="dialog">
    <strong>编辑书签</strong>
    <label>名称<input name="title" required></label>
    <label>网址<input name="url" type="url" required></label>
    <div><button value="cancel" formnovalidate>取消</button><button value="save">保存</button></div>
  </form>
</dialog>
<dialog id="deduplicate-confirm" aria-label="清理重复标签页">
  <form method="dialog">
    <strong>清理重复标签页</strong>
    <p>仅关闭当前窗口中的以下重复标签页：</p>
    <ul></ul>
    <div><button value="cancel" autofocus>取消</button><button value="confirm">清理</button></div>
  </form>
</dialog>
</body>
</html>
